<div id="pdf-modal-overlay" class="pdf-modal-overlay hidden">
    <div class="pdf-modal-container">
        <div class="pdf-modal-header">
            <span id="pdf-modal-title" class="pdf-modal-title">Leyendo documento</span>
            <div id="pdf-reader-options">
                <button
                    type="button"
                    id="pdf-button-rest"
                    class="button button-pdf button-small"
                    data-set-theme="rest"
                    aria-label="Modo descanso de vista"
                >
                    Modo descanso
                </button>
                <button
                    type="button"
                    id="pdf-button-copy"
                    class="button button-pdf button-small"
                    aria-label="Copiar enlace del PDF"
                >
                    Copiar enlace
                </button>
                <button
                    type="button"
                    id="pdf-button-expand"
                    class="button button-pdf button-small"
                    aria-label="Expandir visor"
                >
                    ⤢ Expandir
                </button>
                <button
                    type="button"
                    id="pdf-modal-close"
                    class="button button-pdf button-small"
                    aria-label="Cerrar visor"
                >
                    ✕ Cerrar
                </button>
            </div>
        </div>
        <div class="pdf-modal-body">
            <iframe id="pdf-iframe" src="" title="Visor de PDF"></iframe>
        </div>
    </div>
</div>
